# wow-addons: CNB → GitHub 自动同步（主方向）
# 密钥来源：LLM-Vault（私有仓）github.yml → 注入环境变量 username / token
main:
  push:
    - imports:
        - https://cnb.cool/wuhuarou-2026_799/LLM-Vault/-/blob/main/github.yml
      stages:
        - name: sync-to-github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/shadapang/wow-addons.git
            auth_type: https
            username: ${username}
            password: ${token}
            branch: main        # 只同步 main
            force: false        # 非快进即失败，GitHub 侧分叉时流水线报红=告警
            push_tags: true     # 标签同步：推 tag 后经本流水线落到 GitHub，供 Release/Actions 用
